services:
  mysql:
    image: mysql:8.0
    container_name: mysql-lab
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: ratings_db
      MYSQL_ROOT_PASSWORD: Atoof000000
    volumes:
      - mysql-data:/var/lib/mysql

  mongodb:
    image: mongodb/mongodb-community-server:latest
    container_name: mongodb-lab
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mysql-data:
  mongo-data:
